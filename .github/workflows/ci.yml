name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/kqt ./cmd/kqt
      - run: python3 scripts/tui-smoke.py
      - run: python3 scripts/operator-smoke.py
